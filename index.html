<title>ProfileVault</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1f2933; --muted:#6b7785; --accent:#1d4e89; --accent-soft:#e6eef7;
    --bg:#f6f4ef; --card:#ffffff; --line:#e2ddd2; --ok:#2f7d5b; --warn:#b26a00;
    --nav-w:230px; --bar-h:64px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8ecf0; --muted:#98a4b1; --accent:#7fb2ea; --accent-soft:#1d2b3b;
            --bg:#12171d; --card:#1b222b; --line:#2b3540; --ok:#5cc39a; --warn:#e0a24a; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family:'Sarabun',-apple-system,'Noto Sans Thai',sans-serif; color:var(--ink); background:var(--bg); font-size:16px; line-height:1.5; }

  /* ---- layout ---- */
  #nav { position:fixed; z-index:10; background:var(--card); border-top:1px solid var(--line);
         left:0; right:0; bottom:0; display:flex; justify-content:space-around;
         padding-bottom:env(safe-area-inset-bottom,0px); }
  #nav .brand { display:none; }
  #nav a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
           min-height:var(--bar-h); color:var(--muted); text-decoration:none; font-size:12px; }
  #nav a .ic { font-size:22px; line-height:1; }
  #nav a.active { color:var(--accent); font-weight:700; }
  #main { padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px));
          padding-bottom:calc(var(--bar-h) + 24px + env(safe-area-inset-bottom,0px)); max-width:900px; margin:0 auto; }
  @media (min-width:768px) {
    #nav { top:0; bottom:auto; right:auto; width:var(--nav-w); flex-direction:column; justify-content:flex-start;
           border-top:0; border-right:1px solid var(--line); padding:calc(18px + env(safe-area-inset-top,0px)) 10px 18px; gap:4px; }
    #nav .brand { display:block; font-weight:700; font-size:20px; color:var(--accent); padding:4px 12px 2px; }
    #nav .tag { display:block; font-size:12px; color:var(--muted); padding:0 12px 14px; }
    #nav a { flex:none; flex-direction:row; justify-content:flex-start; gap:12px; min-height:46px; padding:0 12px;
             border-radius:10px; font-size:16px; }
    #nav a.active { background:var(--accent-soft); }
    #main { margin-left:var(--nav-w); max-width:none; padding:28px 32px; }
    #main > .wrap { max-width:860px; }
  }
  #nav .tag { display:none; }
  @media (min-width:768px) { #nav .tag { display:block; } }

  /* ---- components ---- */
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:17px; margin:0 0 10px; }
  .grid { display:grid; gap:12px; grid-template-columns:1fr; }
  @media (min-width:600px) { .grid.two { grid-template-columns:1fr 1fr; } }
  .btn { font:inherit; font-size:16px; min-height:46px; padding:10px 16px; border:0; border-radius:12px; cursor:pointer;
         background:var(--accent); color:#fff; display:inline-flex; align-items:center; gap:8px; }
  .btn.ghost { background:var(--accent-soft); color:var(--accent); }
  .btn[disabled] { opacity:.55; cursor:default; }
  .actions { display:grid; gap:10px; grid-template-columns:1fr 1fr; }
  .bar { height:12px; background:var(--accent-soft); border-radius:99px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--ok); }
  .pill { display:inline-block; font-size:12px; padding:2px 10px; border-radius:99px; background:var(--accent-soft); color:var(--accent); }
  .pill.warn { background:rgba(178,106,0,.15); color:var(--warn); }
  .pill.ok { background:rgba(47,125,91,.15); color:var(--ok); }
  .empty { text-align:center; padding:28px 12px; color:var(--muted); }
  .empty .big { font-size:42px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .seg button { font:inherit; border:0; background:transparent; color:var(--ink); padding:10px 18px; min-height:44px; cursor:pointer; }
  .seg button.on { background:var(--accent); color:#fff; }
  .input { font:inherit; width:100%; min-height:46px; padding:8px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); }
  label.lbl { display:block; font-size:14px; color:var(--muted); margin:0 0 4px; }
  .tests { list-style:none; margin:10px 0 0; padding:0; font-size:14px; }
  .tests li { padding:4px 0; border-bottom:1px solid var(--line); }
  .tests li.fail { color:var(--warn); font-weight:700; }
  [hidden] { display:none !important; }
  a.btn { text-decoration:none; justify-content:center; }
  .btn.danger { background:var(--warn); color:#fff; }
  .btn.sm { min-height:38px; padding:6px 12px; font-size:14px; }
  .row { flex-wrap:wrap; }
  .item { display:flex; gap:12px; align-items:center; text-decoration:none; color:inherit; }
  .item .txt { flex:1; min-width:0; }
  .item .txt b, .item .txt span { display:block; overflow:hidden; text-overflow:ellipsis; }
  .avatar { width:46px; height:46px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:19px; flex:none; }
  .avatar.lg { width:64px; height:64px; font-size:26px; }
  .fld { margin-bottom:12px; }
  textarea.input { min-height:90px; resize:vertical; }
  .chk { display:flex; gap:8px; align-items:center; font-size:14px; color:var(--muted); margin-top:6px; }
  .chk input { width:22px; height:22px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; }
  .msg { color:var(--warn); font-weight:700; min-height:22px; }
  .vh { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
  .avatar { overflow:hidden; }
  .avatar-img { width:100%; height:100%; object-fit:cover; display:block; }
  .photos { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); margin-bottom:12px; }
  .ph img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; display:block; background:var(--accent-soft); }
  .ph .input { min-height:38px; padding:4px 8px; font-size:14px; margin:6px 0; }
  .ph .btns { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .full { grid-column:1 / -1; }
  .tagline { margin-top:6px; }
  .tagline .pill { margin-right:4px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .chip { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:99px; padding:6px 14px; min-height:38px; cursor:pointer; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .preview { text-align:center; }
  .preview img { max-width:100%; max-height:70vh; border-radius:8px; }
  .preview iframe { width:100%; height:65vh; border:1px solid var(--line); border-radius:8px; background:#fff; }
  pre.txt { white-space:pre-wrap; text-align:left; max-height:60vh; overflow:auto; font-size:13px; margin:0; }
  a:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>

  var DB_NAME = 'profilevault', DB_VERSION = 1;
  var STORES = {
    workspace: {},
    persons: {},

  var dbPromise = null;

      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function (ev) {
        for (var v = ev.oldVersion + 1; v <= ev.newVersion; v++) if (MIGRATIONS[v]) MIGRATIONS[v](req.result, req.transaction);
      };
      req.onsuccess = function () { var db = req.result; db.onversionchange = function () { db.close(); dbPromise = null; }; resolve(db); };
      req.onerror = function () { dbPromise = null; reject(req.error); };
      req.onblocked = function () { dbPromise = null; reject(new Error('Database upgrade blocked. Close other tabs of this app.')); };
    });

  }
  function reqP(r) { return new Promise(function (res, rej) { r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; }); }
  function txDone(tx) {
    return new Promise(function (res, rej) {

    var b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    var h = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }
  function nowIso() { return new Date().toISOString(); }

  var CONTACT_KINDS = ['address_home', 'address_work', 'address_school', 'address_mailing', 'mobile', 'phone', 'email', 'website', 'linkedin', 'other'];
  var KIND_KEYS = { address_home: 'kHome', address_work: 'kWork', address_school: 'kSchool', address_mailing: 'kMail',
                    mobile: 'kMobile', phone: 'kPhone', email: 'kEmail', website: 'kWeb', linkedin: 'kLinked', other: 'kOther' };
  function isAddr(k) { return String(k).indexOf('address_') === 0; }
  function contactText(c) {
    if (isAddr(c.kind)) { var d = c.data || {}; return [d.line, d.district, d.province, d.postalCode, d.country].filter(Boolean).join(', '); }
    return c.value || '';
  }
  function titleText(x) { return typeof x === 'string' ? x : (x && (x.en || x.th)) || ''; }
  function hasName(o) {
    var n = o && o.names;
    return !!n && ['en', 'th'].some(function (l) { return n[l] && typeof n[l] === 'object' && (n[l].first || n[l].last); });
  }
  function validate(store, o) {
    if (store === 'persons' && !hasName(o)) throw new Error('A first or last name is required');
    if (PRIVACY_STORES.indexOf(store) >= 0 && PRIVACY.indexOf(o.privacy) < 0) throw new Error('Invalid privacy level');
    if (PERSON_SCOPED.indexOf(store) >= 0 && typeof o.personId !== 'string') throw new Error('personId is required');
    if (store === 'records') {
      if (RECORD_TYPES.indexOf(o.type) < 0) throw new Error('Invalid record type: ' + o.type);
      if (!titleText(o.title)) throw new Error('Record title is required');
    }
    if (store === 'contacts') {
      if (CONTACT_KINDS.indexOf(o.kind) < 0) throw new Error('Invalid contact type');
      if (!contactText(o)) throw new Error('Contact details are required');
    }
    if (store === 'photos' && !o.blobId) throw new Error('blobId is required');
    if (store === 'documents' && !o.fileName) throw new Error('fileName is required');

  var repo = {
    create: async function (store, data) {
      if (!STORES[store]) throw new Error('Unknown store: ' + store);
      var db = await openDb(), now = nowIso();
      var o = Object.assign({}, data, { id: data.id || uuid(), createdAt: data.createdAt || now, updatedAt: now, deletedAt: null });
      if (PRIVACY_STORES.indexOf(store) >= 0) o.privacy = o.privacy || 'private';
      validate(store, o);
      var scoped = PERSON_SCOPED.indexOf(store) >= 0;
      var tx = db.transaction(scoped ? [store, 'persons'] : [store], 'readwrite');
      if (scoped) {
        var p = await reqP(tx.objectStore('persons').get(o.personId));
        if (!p || p.deletedAt) throw new Error('Person not found');
      }
      tx.objectStore(store).add(o);
      await txDone(tx);
      return o;
    },
    get: async function (store, id) {
      var db = await openDb();
      return (await reqP(db.transaction(store).objectStore(store).get(id))) || null;
    },
    list: async function (store, opts) {
      opts = opts || {};
      var db = await openDb(), os = db.transaction(store).objectStore(store);
      var items = opts.personId ? await reqP(os.index('personId').getAll(opts.personId)) : await reqP(os.getAll());
      return items.filter(function (x) {
        return (opts.includeDeleted || !x.deletedAt) && (!opts.type || x.type === opts.type);
      });
    },
    update: async function (store, id, patch) {
      var db = await openDb(), tx = db.transaction(store, 'readwrite'), os = tx.objectStore(store);
      var cur = await reqP(os.get(id));
      if (!cur) throw new Error('Record not found');
      var clean = Object.assign({}, patch);
      ['id', 'createdAt', 'personId'].forEach(function (k) { delete clean[k]; });
      var o = Object.assign({}, cur, clean, { updatedAt: nowIso() });
      validate(store, o);
      os.put(o);
      await txDone(tx);
      return o;
    },
    softDelete: async function (store, id) {
      return repo.update(store, id, { deletedAt: nowIso() });
    },
    restore: async function (store, id) {
      return repo.update(store, id, { deletedAt: null, deletedVia: null });
    },
    // Hides a person and everything that belongs to them (kept as tombstones so merges stay correct)
    softDeletePerson: async function (personId) {
      var db = await openDb(), tx = db.transaction(PERSON_SCOPED.concat(['persons']), 'readwrite'), now = nowIso();
      var p = await reqP(tx.objectStore('persons').get(personId));
      if (!p) throw new Error('Person not found');
      p.deletedAt = now; p.updatedAt = now; tx.objectStore('persons').put(p);
      for (var i = 0; i < PERSON_SCOPED.length; i++) {
        var os = tx.objectStore(PERSON_SCOPED[i]);
        var items = await reqP(os.index('personId').getAll(personId));
        items.forEach(function (it) { if (!it.deletedAt) { it.deletedAt = now; it.deletedVia = personId; it.updatedAt = now; os.put(it); } });
      }
      await txDone(tx);
    },
    // Brings back a person and only the items that were hidden together with them
    restorePerson: async function (personId) {
      var db = await openDb(), tx = db.transaction(PERSON_SCOPED.concat(['persons']), 'readwrite'), now = nowIso();
      var p = await reqP(tx.objectStore('persons').get(personId));
      if (!p) throw new Error('Person not found');
      p.deletedAt = null; p.updatedAt = now; tx.objectStore('persons').put(p);
      for (var i = 0; i < PERSON_SCOPED.length; i++) {
        var os = tx.objectStore(PERSON_SCOPED[i]);
        var items = await reqP(os.index('personId').getAll(personId));
        items.forEach(function (it) { if (it.deletedAt && it.deletedVia === personId) { it.deletedAt = null; it.deletedVia = null; it.updatedAt = now; os.put(it); } });
      }
      await txDone(tx);
    },
    // Permanently erases a person, their records and their files (used for "delete forever")
    purgePerson: async function (personId) {
      var db = await openDb(), tx = db.transaction(PERSON_SCOPED.concat(['persons', 'blobs']), 'readwrite');
      var blobIds = [];
      for (var i = 0; i < PERSON_SCOPED.length; i++) {
        var os = tx.objectStore(PERSON_SCOPED[i]);
        var items = await reqP(os.index('personId').getAll(personId));
        items.forEach(function (it) { if (it.blobId) blobIds.push(it.blobId); os.delete(it.id); });

      blobIds.forEach(function (b) { tx.objectStore('blobs').delete(b); });

    if (/Android/i.test(ua)) return 'Android';

  // Self-test: creates temporary data, checks the rules, then erases it.
  async function runSelfTest() {
    var out = [], pid = null, blobId = null;
    function ok(name, cond) { out.push({ name: name, pass: !!cond }); }
    async function fails(fn) { try { await fn(); return false; } catch (e) { return true; } }
    try {
      var p = await repo.create('persons', { names: { en: { first: 'Test', last: 'Person' }, th: { first: 'ทดสอบ' } } });
      pid = p.id;
      ok('Person created, private by default', p.privacy === 'private' && p.deletedAt === null);
      var r = await repo.create('records', { personId: pid, type: 'education', title: { en: 'Test School' }, data: {} });
      ok('Rejects person without a name', await fails(function () { return repo.create('persons', { names: {} }); }));
      ok('Record created with id and timestamps', !!r.id && !!r.createdAt && !!r.updatedAt);
      ok('Rejects record without a title', await fails(function () { return repo.create('records', { personId: pid, type: 'award', title: { en: '', th: '' } }); }));
      ok('Rejects invalid record type', await fails(function () { return repo.create('records', { personId: pid, type: 'nonsense', title: { en: 'x' } }); }));
      ok('Rejects invalid privacy level', await fails(function () { return repo.create('records', { personId: pid, type: 'award', title: 'x', privacy: 'secret' }); }));
      ok('Rejects record for unknown person', await fails(function () { return repo.create('records', { personId: 'nope', type: 'award', title: 'x' }); }));
      var src = new Blob(['hello ProfileVault'], { type: 'text/plain' });
      blobId = await storage.local.put(src);
      var d = await repo.create('documents', { personId: pid, fileName: 'test.txt', mimeType: 'text/plain', size: src.size, category: 'other', blobId: blobId });
      await repo.create('recordDocs', { personId: pid, recordId: r.id, documentId: d.id });
      var back = await storage.local.get(blobId);
      ok('File saved and read back', !!back && back.size === src.size);
      var u = await repo.update('records', r.id, { title: { en: 'Test School 2' } });
      ok('Update changes data, keeps createdAt', u.title.en === 'Test School 2' && u.createdAt === r.createdAt);
      ok('List by person', (await repo.list('records', { personId: pid })).length === 1);
      ok('List by type', (await repo.list('records', { personId: pid, type: 'education' })).length === 1);
      await repo.softDelete('records', r.id);

      ok('Deleted record kept as tombstone', (await repo.list('records', { personId: pid, includeDeleted: true })).length === 1);
      await repo.restore('records', r.id);
      ok('Restore brings it back', (await repo.list('records', { personId: pid })).length === 1);
      var r2 = await repo.create('records', { personId: pid, type: 'award', title: { en: 'Deleted on its own' } });
      await repo.softDelete('records', r2.id);
      await repo.softDeletePerson(pid);
      var people = await repo.list('persons');
      ok('Deleting a person hides them and their data',
         people.filter(function (x) { return x.id === pid; }).length === 0 &&
         (await repo.list('records', { personId: pid })).length === 0 &&
         (await repo.list('documents', { personId: pid })).length === 0);
      ok('Cascade keeps tombstones for merging', (await repo.list('documents', { personId: pid, includeDeleted: true })).length === 1);
      await repo.restorePerson(pid);

         (await repo.list('persons')).some(function (x) { return x.id === pid; }) &&
         (await repo.list('documents', { personId: pid })).length === 1);

    } catch (e) {

  async function processImage(file) {
    try {
      var bmp;
      try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e1) { bmp = await createImageBitmap(file); }
      var sc = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
      var c = document.createElement('canvas');
      c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      if (bmp.close) bmp.close();
      var blob = await new Promise(function (res) { c.toBlob(res, 'image/jpeg', 0.85); });
      if (blob) return { blob: blob, width: c.width, height: c.height };
    } catch (e) { /* use original */ }
    return { blob: file, width: null, height: null };

    if (!contactText(data)) { msg.textContent = t('contactReq'); return; }
    if (data.preferred) {
      var others = await repo.list('contacts', { personId: personId });
      for (var i = 0; i < others.length; i++) if (others[i].kind === kind && others[i].preferred && others[i].id !== id) await repo.update('contacts', others[i].id, { preferred: false });
    }
    if (id) await repo.update('contacts', id, data); else await repo.create('contacts', Object.assign({ personId: personId }, data));
    location.hash = '#people/' + personId;
  }
  function armed(btn, label) {
    if (btn.getAttribute('data-armed')) return true;
    btn.setAttribute('data-armed', '1'); btn.textContent = label; btn.className = 'btn danger sm';
    return false;
  }

  function fld(id, label, val, extra) {
    return '<div class="fld"><label class="lbl" for="' + id + '">' + esc(label) + '</label><input class="input" id="' + id + '" value="' + esc(val || '') + '" ' + (extra || '') + ' autocomplete="off"></div>';
  }
  function nv(p, l, k) { var n = p && p.names && p.names[l]; return (n && typeof n === 'object' && n[k]) || ''; }
  function chk(id, on) { return '<label class="chk"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '> ' + esc(t('privLbl')) + '</label>'; }

  function personForm(p) {
    var priv = p ? (p.privateFields || []) : ['nationalId'];
    var gopts = [['', '—'], ['female', t('gFemale')], ['male', t('gMale')], ['other', t('gOther')], ['undisclosed', t('gUndisclosed')]].map(function (g) {
      return '<option value="' + g[0] + '"' + (p && p.gender === g[0] ? ' selected' : '') + '>' + esc(g[1]) + '</option>';
    }).join('');
    function nameCard(l, title) {
      return '<div class="card"><h2>' + esc(title) + '</h2><div class="grid two">' +
        fld('f_' + l + '_first', t('firstName'), nv(p, l, 'first')) + fld('f_' + l + '_middle', t('middleName'), nv(p, l, 'middle')) +
        fld('f_' + l + '_last', t('lastName'), nv(p, l, 'last')) + '</div></div>';
    }
    return head(p ? t('editPerson') : t('newPerson'), t('privHint')) +
      nameCard('en', t('nameEn')) + nameCard('th', t('nameTh')) +
      '<div class="card"><h2>' + esc(t('about')) + '</h2><div class="grid two">' +
        fld('f_pref', t('preferred'), p && p.preferredName) + fld('f_title', t('titleF'), p && p.title) +
        '<div class="fld"><label class="lbl" for="f_gender">' + esc(t('gender')) + '</label><select class="input" id="f_gender">' + gopts + '</select></div>' +
        '<div class="fld"><label class="lbl" for="f_dob">' + esc(t('dob')) + '</label><input class="input" type="date" id="f_dob" value="' + esc(p && p.dateOfBirth) + '">' + chk('pv_dob', priv.indexOf('dateOfBirth') >= 0) + '</div>' +
        '<div class="fld">' + fld('f_pob', t('pob'), p && p.placeOfBirth).replace('</div>', chk('pv_pob', priv.indexOf('placeOfBirth') >= 0) + '</div>') + '</div>' +
        fld('f_nat', t('nationality'), p && p.nationality) +
        '<div class="fld">' + fld('f_nid', t('nid'), p && p.nationalId).replace('</div>', chk('pv_nid', priv.indexOf('nationalId') >= 0) + '</div>') + '</div>' +
      '</div><div class="fld"><label class="lbl" for="f_notes">' + esc(t('notes')) + '</label><textarea class="input" id="f_notes">' + esc(p && p.notes) + '</textarea></div></div>' +
      '<p id="formMsg" class="msg" aria-live="polite"></p>' +
      '<div class="toolbar"><button class="btn" data-action="save-person" data-id="' + esc(p ? p.id : '') + '">' + esc(t('save')) + '</button>' +
      '<a class="btn ghost" href="#people' + (p ? '/' + esc(p.id) : '') + '">' + esc(t('cancel')) + '</a></div>';
  }

  async function personHome(p) {
    var d = await activePerson(), am = await activePhotos(), isA = d.active && d.active.id === p.id, pf = p.privateFields || [];
    var g = { female: 'gFemale', male: 'gMale', other: 'gOther', undisclosed: 'gUndisclosed' };
    var rows = [
      ['preferred', p.preferredName, ''], ['titleF', p.title, ''], ['gender', p.gender && t(g[p.gender]), ''],
      ['dob', p.dateOfBirth && fmtDate(p.dateOfBirth), 'dateOfBirth'], ['pob', p.placeOfBirth, 'placeOfBirth'],
      ['nationality', p.nationality, ''], ['nid', p.nationalId && ('••••' + p.nationalId.slice(-3)), 'nationalId'], ['notes', p.notes, '']
    ].filter(function (r) { return r[1]; }).map(function (r) {
      return '<div class="row"><span class="sub" style="margin:0">' + esc(t(r[0])) + '</span><span>' + esc(r[1]) +
             (r[2] && pf.indexOf(r[2]) >= 0 ? ' <span class="pill">' + esc(t('privLbl')) + '</span>' : '') + '</span></div>';
    }).join('');
    return '<p><a href="#people">← ' + esc(t('people')) + '</a></p>' +
      '<div class="card item">' + avatar(p, am[p.id], true) + '<span class="txt"><h1 style="margin:0">' + esc(displayName(p)) + '</h1><span class="sub" style="margin:0">' + esc(otherName(p)) + '</span></span></div>' +
      '<div class="toolbar"><a class="btn" href="#people/' + esc(p.id) + '/edit">' + esc(t('edit')) + '</a>' +
        (isA ? '<span class="pill ok" style="align-self:center">' + esc(t('activeLbl')) + '</span>' : '<button class="btn ghost" data-action="make-active" data-id="' + esc(p.id) + '">' + esc(t('makeActive')) + '</button>') +
        '<button class="btn ghost" data-action="ask-delete">' + esc(t('del')) + '</button></div>' +
      '<div id="delBox" class="card" hidden><p><b>' + esc(t('delAsk')) + '</b></p><p class="sub">' + esc(t('delWarn')) + '</p>' +
        '<button class="btn danger" data-action="do-delete" data-id="' + esc(p.id) + '">' + esc(t('yesDelete')) + '</button> ' +
        '<button class="btn ghost" data-action="cancel-delete">' + esc(t('cancel')) + '</button></div>' +
      '<div class="card"><h2>' + esc(t('basicInfo')) + '</h2>' + (rows || '<p class="sub" style="margin:0">—</p>') + '</div>' +
      (await recordsCard(p)) + (await docsCard(p)) + (await photosCard(p)) + (await contactsCard(p));
  }

  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function on(id) { var el = document.getElementById(id); return !!(el && el.checked); }
  function collectPerson() {
    var priv = [];
    if (on('pv_dob')) priv.push('dateOfBirth');
    if (on('pv_pob')) priv.push('placeOfBirth');
    if (on('pv_nid')) priv.push('nationalId');
    function n(l) { return { first: val('f_' + l + '_first'), middle: val('f_' + l + '_middle'), last: val('f_' + l + '_last') }; }
    return { names: { en: n('en'), th: n('th') }, preferredName: val('f_pref'), title: val('f_title'), gender: val('f_gender'),
             dateOfBirth: val('f_dob'), placeOfBirth: val('f_pob'), nationality: val('f_nat'), nationalId: val('f_nid'),
             privateFields: priv, notes: val('f_notes'), status: 'active' };
  }
  async function savePerson(id) {
    var data = collectPerson(), msg = document.getElementById('formMsg');
    if (!hasName(data)) { msg.textContent = t('nameReq'); return; }
    if (id) { await repo.update('persons', id, data); location.hash = '#people/' + id; render(); return; }
    var np = await repo.create('persons', data);
    var d = await activePerson();
    if (!d.active) await updateWorkspace({ activePersonId: np.id });
    location.hash = '#people/' + np.id;
  }

  async function refreshDeletedList() {
    var box = document.getElementById('deletedList');
    if (!box) return;
    var persons = await repo.list('persons', { includeDeleted: true }), gone = {};
    var del = persons.filter(function (x) { if (x.deletedAt) gone[x.id] = 1; return x.deletedAt; });
    var html = del.map(function (x) {
      return '<div class="row"><span>' + esc(displayName(x)) + '</span><span><button class="btn ghost sm" data-action="restore-person" data-id="' + esc(x.id) + '">' + esc(t('restore')) +
             '</button> <button class="btn ghost sm" data-action="purge-person" data-id="' + esc(x.id) + '">' + esc(t('forever')) + '</button></span></div>';
    }).join('');
    var stores = ['records', 'documents', 'contacts', 'photos'];
    for (var i = 0; i < stores.length; i++) {
      var items = (await repo.list(stores[i], { includeDeleted: true })).filter(function (x) { return x.deletedAt && !x.deletedVia && !gone[x.personId]; });
      items.forEach(function (x) {
        var label = stores[i] === 'records' ? TYPE_DEFS[x.type].icon + ' ' + bi(x.title) : stores[i] === 'documents' ? '📁 ' + x.fileName :
                    stores[i] === 'contacts' ? '☎️ ' + t(KIND_KEYS[x.kind]) + ' ' + contactText(x) : '🖼️ ' + t(PHOTO_LABELS[x.label] || 'pOther');
        html += '<div class="row"><span>' + esc(label) + '</span><button class="btn ghost sm" data-action="restore-item" data-store="' + stores[i] + '" data-id="' + esc(x.id) + '">' + esc(t('restore')) + '</button></div>';
      });
    }
    box.innerHTML = html || '<p class="sub" style="margin:0">' + esc(t('nothingDeleted')) + '</p>';
  }

  function settingsView() {
    var standalone = (window.navigator.standalone === true) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var install = standalone ? '<span class="pill ok">' + esc(t('installed')) + '</span>'
                             : (ios ? '<p style="margin:0">' + esc(t('installIos')) + '</p>' : '<p class="sub" style="margin:0">—</p>');
    return head(t('settings'), t('deviceNote')) +
      '<div class="card"><h2>' + esc(t('language')) + '</h2><div class="seg" role="group">' +
        '<button data-lang="en" class="' + (lang === 'en' ? 'on' : '') + '">English</button>' +
        '<button data-lang="th" class="' + (lang === 'th' ? 'on' : '') + '">ไทย</button></div></div>' +
      '<div class="card"><h2>' + esc(t('appearance')) + '</h2><p style="margin:0">' + esc(t('autoTheme')) + '</p></div>' +
      '<div class="card"><h2>' + esc(t('storage')) + '</h2>' +
        '<div class="row"><span>' + esc(t('persistent')) + '</span><span id="persistState" class="pill">…</span></div>' +
        '<div class="row"><span>' + esc(t('used')) + '</span><span id="usedState">…</span></div>' +
        '<p id="persistMsg" class="sub" style="margin:8px 0"></p>' +
        '<button class="btn ghost" id="persistBtn">' + esc(t('requestPersist')) + '</button></div>' +
      '<div class="card"><h2>' + esc(t('installTitle')) + '</h2>' + install + '</div>' +
      '<div class="card"><h2>' + esc(t('dbTitle')) + '</h2>' +
        '<div class="row"><span>' + esc(t('dbTitle')) + '</span><span id="dbState" class="pill">…</span></div>' +
        '<div class="row"><span>' + esc(t('cPeople')) + '</span><b id="cPeople">–</b></div>' +
        '<div class="row"><span>' + esc(t('cRecords')) + '</span><b id="cRecords">–</b></div>' +
        '<div class="row"><span>' + esc(t('cDocs')) + '</span><b id="cDocs">–</b></div>' +
        '<p id="dbMsg" class="sub" style="margin:8px 0"></p>' +
        '<label class="lbl" for="deviceName">' + esc(t('deviceName')) + '</label>' +
        '<div style="display:flex;gap:8px"><input id="deviceName" class="input" maxlength="60" autocomplete="off">' +
        '<button class="btn ghost" id="deviceSave">' + esc(t('save')) + '</button></div>' +
        '<div style="margin-top:14px"><button class="btn" id="testBtn">' + esc(t('runTest')) + '</button></div>' +
        '<div id="testOut" aria-live="polite"></div></div>' +
      '<div class="card"><h2>' + esc(t('recentlyDeleted')) + '</h2><div id="deletedList"></div></div>' +
      '<div class="card"><h2>' + esc(t('backup')) + '</h2><p class="sub" style="margin:0">' + esc(t('soon')) + ' 7</p></div>' +
      '<p class="sub">' + esc(t('version')) + ': ' + esc(APP_VERSION) + '</p>';
  }

  function refreshStorageInfo() {
    var ps = document.getElementById('persistState'), us = document.getElementById('usedState');
    if (!ps) return;
    if (navigator.storage && navigator.storage.persisted) {
      navigator.storage.persisted().then(function (p) {
        ps.textContent = p ? t('yes') : t('no'); ps.className = 'pill ' + (p ? 'ok' : 'warn');
      });
    } else { ps.textContent = t('unknown'); }
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then(function (e) {
        us.textContent = (e.usage / 1048576).toFixed(1) + ' MB' + (e.quota ? ' / ' + Math.round(e.quota / 1048576) + ' MB' : '');
      });
    } else { us.textContent = t('unknown'); }
  }

  // ---------- Rendering ----------
  function renderNav() {
    var cur = currentRoute().id;
    var html = '<span class="brand">' + esc(t('app')) + '</span><span class="tag">' + esc(t('tagline')) + '</span>';
    ROUTES.forEach(function (r) {
      html += '<a href="#' + r.id + '" class="' + (r.id === cur ? 'active' : '') + '"' + (r.id === cur ? ' aria-current="page"' : '') + '>' +
              '<span class="ic" aria-hidden="true">' + r.icon + '</span><span>' + esc(t(r.id)) + '</span></a>';
    });
    document.getElementById('nav').innerHTML = html;
  }
  var renderToken = 0;
  function render() {
    document.documentElement.lang = lang;
    document.title = t('app') + ' - ' + t(currentRoute().id);
    renderNav();
    var token = ++renderToken, route = currentRoute().id, view = document.getElementById('view');
    revokeUrls();
    return Promise.resolve().then(function () { return currentRoute().view(); }).then(function (html) {
      if (token !== renderToken) return;
      view.innerHTML = html;
      window.scrollTo(0, 0);
      if (route === 'settings') { refreshStorageInfo(); refreshDbInfo(); refreshDeletedList(); }
    }).catch(function (err) {
      if (token === renderToken) view.innerHTML = '<div class="card"><p class="msg">' + esc(err && err.message || err) + '</p></div>';
    });
  }

  // ---------- Events ----------
  window.addEventListener('hashchange', render);
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'docQ') return;
    var q = e.target.value.trim().toLowerCase();
    Array.prototype.forEach.call(document.querySelectorAll('[data-q]'), function (el) { el.hidden = !!q && el.getAttribute('data-q').indexOf(q) < 0; });
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'switchPerson') updateWorkspace({ activePersonId: el.value }).then(render);
    if (el.id === 'r_current') { var ed = document.getElementById('r_endDate'); if (ed) ed.disabled = el.checked; }
    if (el.id === 'c_kind') { var ad = isAddr(el.value); document.getElementById('addrBox').hidden = !ad; document.getElementById('valBox').hidden = ad; }
    if (el.classList && el.classList.contains('photo-label')) repo.update('photos', el.getAttribute('data-id'), { label: el.value });
    if (el.id === 'docInput') {
      var dfiles = Array.prototype.slice.call(el.files || []), dpid = el.getAttribute('data-person'), cat = document.getElementById('upCat').value;
      addDocuments(dpid, dfiles, cat).then(function (res) {
        el.value = '';
        if (res.errors.length) { var m = document.getElementById('docMsg'); if (m) m.textContent = res.errors.join(' · '); }
        if (res.added) { if (res.errors.length) { setTimeout(render, 2500); } else render(); }
      });
    }
    if (el.id === 'photoInput') {
      var files = Array.prototype.slice.call(el.files || []), pid = el.getAttribute('data-person');
      (async function () {
        for (var i = 0; i < files.length; i++) await addPhoto(pid, files[i]);
        render();
      })().catch(function (err) { var m = document.getElementById('photoMsg'); if (m) m.textContent = err.message; });
    }
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-lang]');
    if (b) {
      lang = b.getAttribute('data-lang');
      try { localStorage.setItem('pv_lang', lang); } catch (err) {}
      render(); return;
    }
    var act = e.target.closest && e.target.closest('[data-action]');
    if (act) {
      var a = act.getAttribute('data-action'), id = act.getAttribute('data-id');
      var fail = function (err) { var m = document.getElementById('formMsg'); if (m) m.textContent = err.message; };
      if (a === 'save-person') { savePerson(id).catch(fail); return; }
      if (a === 'restore-item') { repo.restore(act.getAttribute('data-store'), id).then(function () { refreshDeletedList(); refreshDbInfo(); }); return; }
      if (a === 'pick-doc') { document.getElementById('docInput').click(); return; }
      if (a === 'doc-cat') { docCat = act.getAttribute('data-cat'); render(); return; }
      if (a === 'save-doc') { saveDoc(id).catch(fail); return; }
      if (a === 'download-doc') { (async function () { var dd = await repo.get('documents', id), bb = await storage.local.get(dd.blobId); if (bb) await saveFile(bb, dd.fileName); })().catch(fail); return; }
      if (a === 'del-doc') { if (armed(act, t('tapDelete'))) repo.softDelete('documents', id).then(function () { location.hash = '#documents'; render(); }); return; }
      if (a === 'link') {
        var sv = document.getElementById(act.getAttribute('data-sel')).value;
        if (sv) linkDoc(act.getAttribute('data-person'), act.getAttribute('data-record') || sv, act.getAttribute('data-doc') || sv).then(render).catch(fail);
        return;
      }
      if (a === 'unlink') { repo.softDelete('recordDocs', id).then(render); return; }
      if (a === 'open-vault') { updateWorkspace({ activePersonId: id }).then(function () { location.hash = '#documents'; render(); }); return; }
      if (a === 'save-record') { saveRecord(act.getAttribute('data-person'), act.getAttribute('data-type'), id).catch(fail); return; }
      if (a === 'del-record') { if (armed(act, t('tapDelete'))) repo.softDelete('records', id).then(render); return; }
      if (a === 'save-contact') { saveContact(act.getAttribute('data-person'), id).catch(fail); return; }
      if (a === 'del-contact') { if (armed(act, t('tapDelete'))) repo.softDelete('contacts', id).then(render); return; }
      if (a === 'pick-photo') { document.getElementById('photoInput').click(); return; }
      if (a === 'photo-active') { setActivePhoto(act.getAttribute('data-person'), id).then(render); return; }
      if (a === 'photo-del') { if (armed(act, t('tapDelete'))) deletePhoto(id).then(render); return; }
      if (a === 'make-active') { updateWorkspace({ activePersonId: id }).then(render); return; }
      if (a === 'ask-delete') { document.getElementById('delBox').hidden = false; return; }
      if (a === 'cancel-delete') { document.getElementById('delBox').hidden = true; return; }
      if (a === 'do-delete') { repo.softDeletePerson(id).then(function () { location.hash = '#people'; render(); }); return; }
      if (a === 'restore-person') { repo.restorePerson(id).then(function () { refreshDeletedList(); refreshDbInfo(); }); return; }
      if (a === 'purge-person') {
        if (!act.getAttribute('data-armed')) { act.setAttribute('data-armed', '1'); act.textContent = t('tapAgain'); act.className = 'btn danger sm'; return; }
        repo.purgePerson(id).then(function () { refreshDeletedList(); refreshDbInfo(); });
        return;
      }
    }
    if (e.target.id === 'deviceSave') {
      var nm = document.getElementById('deviceName').value.trim().slice(0, 60);
      updateWorkspace({ deviceName: nm || guessDeviceName() }).then(function () {
        e.target.textContent = t('saved'); setTimeout(function () { e.target.textContent = t('save'); }, 1500);
      });
      return;
    }
    if (e.target.id === 'testBtn') {
      var btn = e.target, out = document.getElementById('testOut');
      btn.disabled = true; out.innerHTML = '<p class="sub">' + esc(t('testRunning')) + '</p>';
      runSelfTest().then(function (res) {
        var failed = res.filter(function (x) { return !x.pass; }).length;
        out.innerHTML = '<p><span class="pill ' + (failed ? 'warn' : 'ok') + '">' + esc(failed ? t('testSomeFail') : t('testAllPass')) + '</span></p>' +
          '<ul class="tests">' + res.map(function (x) { return '<li class="' + (x.pass ? '' : 'fail') + '">' + (x.pass ? '✓ ' : '✗ ') + esc(x.name) + '</li>'; }).join('') + '</ul>';
      }).catch(function (err) { out.innerHTML = '<p class="sub">' + esc(err.message) + '</p>'; })
        .then(function () { btn.disabled = false; refreshDbInfo(); });
      return;
    }
    if (e.target.id === 'persistBtn') {
      var msg = document.getElementById('persistMsg');
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().then(function (ok) { msg.textContent = ok ? '' : t('persistDenied'); refreshStorageInfo(); });
      } else { msg.textContent = t('persistDenied'); }
    }
  });

  render();
})();
</script>
</body>
</html>
