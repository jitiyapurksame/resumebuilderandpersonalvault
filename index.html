<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src blob:">
<title>ProfileVault</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#3b4252; --muted:#6b7287; --accent:#5468bd; --accent-soft:#eef0fb;
    --bg:#faf8f6; --card:#ffffff; --line:#eeeae4; --ok:#4a8a6e; --warn:#9a5f22;
    --btn-bg:#d6ddfb; --btn-ink:#2c3873; --danger-bg:#fadcd7; --danger-ink:#8c2f26; --ring:rgba(84,104,189,.25);
    --pill-bg:#eef0fb; --pill-ink:#4a5aa8; --pill-ok-bg:#ddf3e8; --pill-ok-ink:#2f6b4f; --pill-warn-bg:#fdebd8; --pill-warn-ink:#94571a;
    --avatar-bg:#f1e8fa; --avatar-ink:#6a4fa3; --mint:#a9ddc6; --peach:#f6cfa8;
    --nav-w:230px; --bar-h:64px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6e8f0; --muted:#9aa0b4; --accent:#aab6f2; --accent-soft:#262a3d;
            --bg:#17181f; --card:#1f212b; --line:#2c2f3c; --ok:#7fcfa9; --warn:#e3b27a;
            --btn-bg:#3b4378; --btn-ink:#e9ecff; --danger-bg:#5a2f2c; --danger-ink:#ffd9d3; --ring:rgba(170,182,242,.3);
            --pill-bg:#2b3050; --pill-ink:#c3cbf5; --pill-ok-bg:#23403a; --pill-ok-ink:#a6e6c8; --pill-warn-bg:#4a3a26; --pill-warn-ink:#f1c995;
            --avatar-bg:#33284a; --avatar-ink:#d6c3f5; --mint:#4f9c80; --peach:#8a6a45; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family:'Sarabun',-apple-system,'Noto Sans Thai',sans-serif; color:var(--ink); background:var(--bg); font-size:16px; line-height:1.5; }

  /* ---- layout ---- */
  #nav { position:fixed; z-index:10; background:var(--card); border-top:1px solid var(--line);
         left:0; right:0; bottom:0; display:flex; justify-content:space-around;
         padding-bottom:env(safe-area-inset-bottom,0px); }
  #nav .brand { display:none; }
  #nav a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
           min-height:var(--bar-h); color:var(--muted); text-decoration:none; font-size:12px; }
  #nav a .ic { display:flex; } #nav a .ic svg { width:24px; height:24px; }
  #nav a.active { color:var(--accent); font-weight:600; }
  #main { padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px));
          padding-bottom:calc(var(--bar-h) + 24px + env(safe-area-inset-bottom,0px)); max-width:900px; margin:0 auto; }
  @media (min-width:768px) {
    #nav { top:0; bottom:auto; right:auto; width:var(--nav-w); flex-direction:column; justify-content:flex-start;
           border-top:0; border-right:1px solid var(--line); padding:calc(18px + env(safe-area-inset-top,0px)) 10px 18px; gap:4px; }
    #nav .brand { display:block; font-weight:700; font-size:20px; color:var(--accent); padding:4px 12px 2px; }
    #nav .tag { display:block; font-size:12px; color:var(--muted); padding:0 12px 14px; }
    #nav a { flex:none; flex-direction:row; justify-content:flex-start; gap:12px; min-height:46px; padding:0 12px;
             border-radius:10px; font-size:16px; }
    #nav a.active { background:var(--accent-soft); }
    #main { margin-left:var(--nav-w); max-width:none; padding:28px 32px; }
    #main > .wrap { max-width:860px; }
  }
  #nav .tag { display:none; }
  @media (min-width:768px) { #nav .tag { display:block; } }

  /* ---- components ---- */
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:14px; }
  .card h2 { font-size:17px; margin:0 0 10px; }
  .grid { display:grid; gap:12px; grid-template-columns:1fr; }
  @media (min-width:600px) { .grid.two { grid-template-columns:1fr 1fr; } }
  .btn { font:inherit; font-size:16px; min-height:46px; padding:10px 16px; border:0; border-radius:12px; cursor:pointer;
         background:var(--btn-bg); color:var(--btn-ink); font-weight:500; display:inline-flex; align-items:center; gap:8px; }
  .btn.ghost { background:var(--accent-soft); color:var(--pill-ink); }
  .btn[disabled] { opacity:.55; cursor:default; }
  .actions { display:grid; gap:10px; grid-template-columns:1fr 1fr; }
  .bar { height:12px; background:var(--accent-soft); border-radius:99px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--mint); border-radius:99px; }
  .pill { display:inline-block; font-size:12px; padding:2px 10px; border-radius:99px; background:var(--pill-bg); color:var(--pill-ink); }
  .pill.warn { background:var(--pill-warn-bg); color:var(--pill-warn-ink); }
  .pill.ok { background:var(--pill-ok-bg); color:var(--pill-ok-ink); }
  .empty { text-align:center; padding:28px 12px; color:var(--muted); }
  .empty .big { font-size:42px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .seg button { font:inherit; border:0; background:transparent; color:var(--ink); padding:10px 18px; min-height:44px; cursor:pointer; }
  .seg button.on { background:var(--btn-bg); color:var(--btn-ink); font-weight:600; }
  .input { font:inherit; width:100%; min-height:46px; padding:8px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); }
  label.lbl { display:block; font-size:14px; color:var(--muted); margin:0 0 4px; }
  .tests { list-style:none; margin:10px 0 0; padding:0; font-size:14px; }
  .tests li { padding:4px 0; border-bottom:1px solid var(--line); }
  .tests li.fail { color:var(--warn); font-weight:700; }
  [hidden] { display:none !important; }
  a.btn { text-decoration:none; justify-content:center; }
  .btn.danger { background:var(--danger-bg); color:var(--danger-ink); }
  .btn.sm { min-height:38px; padding:6px 12px; font-size:14px; }
  .row { flex-wrap:wrap; }
  .item { display:flex; gap:12px; align-items:center; text-decoration:none; color:inherit; }
  .item .txt { flex:1; min-width:0; }
  .item .txt b, .item .txt span { display:block; overflow:hidden; text-overflow:ellipsis; }
  .avatar { width:46px; height:46px; border-radius:50%; background:var(--avatar-bg); color:var(--avatar-ink); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:19px; flex:none; }
  .avatar.lg { width:64px; height:64px; font-size:26px; }
  .fld { margin-bottom:12px; }
  textarea.input { min-height:90px; resize:vertical; }
  .chk { display:flex; gap:8px; align-items:center; font-size:14px; color:var(--muted); margin-top:6px; }
  .chk input { width:22px; height:22px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; }
  .msg { color:var(--warn); font-weight:700; min-height:22px; }
  .vh { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
  .avatar { overflow:hidden; }
  .avatar-img { width:100%; height:100%; object-fit:cover; display:block; }
  .photos { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); margin-bottom:12px; }
  .ph img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; display:block; background:var(--accent-soft); }
  .ph .input { min-height:38px; padding:4px 8px; font-size:14px; margin:6px 0; }
  .ph .btns { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .full { grid-column:1 / -1; }
  .tagline { margin-top:6px; }
  .tagline .pill { margin-right:4px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .chip { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:99px; padding:6px 14px; min-height:38px; cursor:pointer; }
  .chip.on { background:var(--btn-bg); color:var(--btn-ink); border-color:var(--btn-bg); font-weight:500; }
  .preview { text-align:center; }
  .preview img { max-width:100%; max-height:70vh; border-radius:8px; }
  .preview iframe { width:100%; height:65vh; border:1px solid var(--line); border-radius:8px; background:#fff; }
  pre.txt { white-space:pre-wrap; text-align:left; max-height:60vh; overflow:auto; font-size:13px; margin:0; }
  .warnbox { border-color:var(--peach); background:var(--pill-warn-bg); }
  h1, h2 { font-weight:600; }
  .input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--ring); }
  .empty .big { opacity:.75; }
  .avatar:not(:has(.avatar-img)) { filter:saturate(.7); }
  .btn:active { filter:brightness(.97); }
  .rb { display:grid; gap:16px; }
  @media (min-width:1000px) { .rb { grid-template-columns:minmax(300px,380px) 1fr; align-items:start; } #rbPreviewCol { position:sticky; top:12px; } }
  @media (max-width:999px) { .rb[data-tab="edit"] #rbPreviewCol { display:none; } .rb[data-tab="preview"] #rbControls { display:none; } }
  @media (min-width:1000px) { .rbtabs { display:none; } }
  details summary { cursor:pointer; padding:6px 0; color:var(--pill-ink); }
  .paper-wrap { width:100%; overflow:hidden; }
  .paper { width:793px; min-height:1122px; padding:57px; background:#fff; color:#1f2933; color-scheme:light; transform-origin:0 0;
           font-size:11pt; line-height:1.45; border:1px solid #e6e2da; box-sizing:border-box; font-family:'Sarabun',-apple-system,'Noto Sans Thai',sans-serif; }
  .paper * { color-scheme:light; }
  .cv-head { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:8px; }
  .cv-name { font-size:24pt; line-height:1.15; margin:0; color:#33408a; font-weight:600; }
  .cv-line { color:#4a5160; font-size:10pt; margin-top:4px; }
  .cv-photo { width:100px; height:120px; object-fit:cover; border-radius:8px; flex:none; }
  .cv-sec { margin-top:14px; }
  .cv-sec h2 { font-size:12pt; margin:0 0 6px; color:#33408a; border-bottom:1.5px solid #c9d2f3; padding-bottom:2px; font-weight:600; break-after:avoid; }
  .cv-item { margin-bottom:7px; break-inside:avoid; }
  .cv-row { display:flex; justify-content:space-between; gap:12px; }
  .cv-date { color:#5b6475; white-space:nowrap; font-size:10pt; }
  .cv-sub { color:#5b6475; font-size:10pt; }
  .cv-item p, .paper p { margin:2px 0; } .cv-item ul { margin:2px 0 2px 18px; padding:0; }
  @media print {
    #nav, .noprint { display:none !important; }
    body { background:#fff; }
    #main { margin:0 !important; padding:0 !important; max-width:none !important; }
    #main > .wrap { max-width:none !important; }
    .rb { display:block !important; } #rbPreviewCol { display:block !important; position:static !important; }
    .card.pvcard { border:0; padding:0; margin:0; background:transparent; }
    .paper-wrap { height:auto !important; overflow:visible !important; }
    .paper { transform:none !important; width:auto !important; min-height:0 !important; padding:0 !important; border:0 !important; }
    @page { size:A4; margin:15mm; }
  }
  .tl { border-left:2px solid var(--line); margin-left:8px; padding-left:18px; }
  .tl-year { font-weight:600; color:var(--pill-ink); margin:16px 0 4px; }
  .tl-item { display:block; position:relative; padding:6px 0; text-decoration:none; color:inherit; }
  .tl-item:before { content:''; position:absolute; left:-25px; top:13px; width:10px; height:10px; border-radius:50%; background:var(--mint); border:2px solid var(--bg); }
  #nav a { min-width:0; } @media (max-width:420px) { #nav a { font-size:11px; } }
  a:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>

  // Shrinks big camera photos (max 1000 px, JPEG) so the vault stays small; falls back to the original file.
  async function processImage(file) {
    try {
      var bmp;
      try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e1) { bmp = await createImageBitmap(file); }
      var sc = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
      var c = document.createElement('canvas');
      c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      if (bmp.close) bmp.close();
      var blob = await new Promise(function (res) { c.toBlob(res, 'image/jpeg', 0.85); });
      if (blob) return { blob: blob, width: c.width, height: c.height };
    } catch (e) { /* use original */ }
    return { blob: file, width: null, height: null };
  }

    var img = await processImage(file);
    var blobId = await storage.local.put(img.blob);
    var has = (await repo.list('photos', { personId: personId })).some(function (x) { return x.active; });
    return repo.create('photos', { personId: personId, blobId: blobId, label: 'current', date: nowIso().slice(0, 10),

    var np = await repo.create('persons', data);
    var d = await activePerson();
    if (!d.active) await updateWorkspace({ activePersonId: np.id });
    location.hash = '#people/' + np.id;
  }

  async function refreshDeletedList() {
    var box = document.getElementById('deletedList');
    if (!box) return;
    var persons = await repo.list('persons', { includeDeleted: true }), gone = {};
    var del = persons.filter(function (x) { if (x.deletedAt) gone[x.id] = 1; return x.deletedAt; });
    var html = del.map(function (x) {
      return '<div class="row"><span>' + esc(displayName(x)) + '</span><span><button class="btn ghost sm" data-action="restore-person" data-id="' + esc(x.id) + '">' + esc(t('restore')) +
             '</button> <button class="btn ghost sm" data-action="purge-person" data-id="' + esc(x.id) + '">' + esc(t('forever')) + '</button></span></div>';
    }).join('');
    var stores = ['records', 'documents', 'contacts', 'photos'];
    for (var i = 0; i < stores.length; i++) {
      var items = (await repo.list(stores[i], { includeDeleted: true })).filter(function (x) { return x.deletedAt && !x.deletedVia && !gone[x.personId]; });
      items.forEach(function (x) {
        var label = stores[i] === 'records' ? TYPE_DEFS[x.type].icon + ' ' + bi(x.title) : stores[i] === 'documents' ? '📁 ' + x.fileName :
                    stores[i] === 'contacts' ? '☎️ ' + t(KIND_KEYS[x.kind]) + ' ' + contactText(x) : '🖼️ ' + t(PHOTO_LABELS[x.label] || 'pOther');
        html += '<div class="row"><span>' + esc(label) + '</span><button class="btn ghost sm" data-action="restore-item" data-store="' + stores[i] + '" data-id="' + esc(x.id) + '">' + esc(t('restore')) + '</button></div>';
      });
    }
    box.innerHTML = html || '<p class="sub" style="margin:0">' + esc(t('nothingDeleted')) + '</p>';
  }

  function settingsView() {
    var standalone = (window.navigator.standalone === true) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var install = standalone ? '<span class="pill ok">' + esc(t('installed')) + '</span>'
                             : (ios ? '<p style="margin:0">' + esc(t('installIos')) + '</p>' : '<p class="sub" style="margin:0">—</p>');
    return head(t('settings'), t('deviceNote')) +
      '<div class="card"><h2>' + esc(t('language')) + '</h2><div class="seg" role="group">' +
        '<button data-lang="en" class="' + (lang === 'en' ? 'on' : '') + '">English</button>' +
        '<button data-lang="th" class="' + (lang === 'th' ? 'on' : '') + '">ไทย</button></div></div>' +
      '<div class="card"><h2>' + esc(t('appearance')) + '</h2><p style="margin:0">' + esc(t('autoTheme')) + '</p></div>' +
      '<div class="card"><h2>' + esc(t('storage')) + '</h2>' +
        '<div class="row"><span>' + esc(t('persistent')) + '</span><span id="persistState" class="pill">…</span></div>' +
        '<div class="row"><span>' + esc(t('used')) + '</span><span id="usedState">…</span></div>' +
        '<p id="persistMsg" class="sub" style="margin:8px 0"></p>' +
        '<button class="btn ghost" id="persistBtn">' + esc(t('requestPersist')) + '</button></div>' +
      '<div class="card"><h2>' + esc(t('installTitle')) + '</h2>' + install + '</div>' +
      '<div class="card"><h2>' + esc(t('dbTitle')) + '</h2>' +
        '<div class="row"><span>' + esc(t('dbTitle')) + '</span><span id="dbState" class="pill">…</span></div>' +
        '<div class="row"><span>' + esc(t('cPeople')) + '</span><b id="cPeople">–</b></div>' +
        '<div class="row"><span>' + esc(t('cRecords')) + '</span><b id="cRecords">–</b></div>' +
        '<div class="row"><span>' + esc(t('cDocs')) + '</span><b id="cDocs">–</b></div>' +
        '<p id="dbMsg" class="sub" style="margin:8px 0"></p>' +
        '<label class="lbl" for="deviceName">' + esc(t('deviceName')) + '</label>' +
        '<div style="display:flex;gap:8px"><input id="deviceName" class="input" maxlength="60" autocomplete="off">' +
        '<button class="btn ghost" id="deviceSave">' + esc(t('save')) + '</button></div>' +
        '<div style="margin-top:14px"><button class="btn" id="testBtn">' + esc(t('runTest')) + '</button></div>' +
        '<div id="testOut" aria-live="polite"></div></div>' +
      '<div class="card"><h2>' + esc(t('recentlyDeleted')) + '</h2><div id="deletedList"></div></div>' +
      '<div class="card" id="backupCard"><h2>' + esc(t('backupTitle')) + '</h2>' +
        '<div class="fld"><label class="lbl" for="bkScope">' + esc(t('bkScope')) + '</label><select id="bkScope" class="input"><option value="all">' + esc(t('bkAll')) + '</option><option value="selected">' + esc(t('bkSel')) + '</option></select></div>' +
        '<div id="bkPeople" hidden></div>' +
        '<label class="chk"><input type="checkbox" id="bkFiles" checked> ' + esc(t('bkFiles')) + '</label>' +
        '<div class="grid two" style="margin-top:10px"><div class="fld"><label class="lbl" for="bkPass">' + esc(t('bkPass')) + '</label><input id="bkPass" type="password" class="input" autocomplete="new-password"></div>' +
        '<div class="fld"><label class="lbl" for="bkPass2">' + esc(t('bkPass2')) + '</label><input id="bkPass2" type="password" class="input" autocomplete="new-password"></div></div>' +
        '<p class="sub">' + esc(t('bkPassWarn')) + '</p>' +
        '<button class="btn" data-action="make-backup">' + esc(t('bkMake')) + '</button><div id="bkOut" aria-live="polite" style="margin-top:10px"></div></div>' +
      '<div class="card"><h2>' + esc(t('restoreTitle')) + '</h2>' +
        '<input type="file" id="rsInput" class="vh" tabindex="-1"><button class="btn ghost" data-action="pick-restore">' + esc(t('rsPick')) + '</button>' +
        '<div id="rsOut" aria-live="polite" style="margin-top:10px"></div></div>' +
      '<div class="card"><h2>' + esc(t('snapTitle')) + '</h2><div id="snapBox"></div></div>' +
      '<p class="sub">' + esc(t('version')) + ': ' + esc(APP_VERSION) + '</p>';
  }

  function refreshStorageInfo() {
    var ps = document.getElementById('persistState'), us = document.getElementById('usedState');
    if (!ps) return;
    if (navigator.storage && navigator.storage.persisted) {
      navigator.storage.persisted().then(function (p) {
        ps.textContent = p ? t('yes') : t('no'); ps.className = 'pill ' + (p ? 'ok' : 'warn');
      });
    } else { ps.textContent = t('unknown'); }
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then(function (e) {
        us.textContent = (e.usage / 1048576).toFixed(1) + ' MB' + (e.quota ? ' / ' + Math.round(e.quota / 1048576) + ' MB' : '');
      });
    } else { us.textContent = t('unknown'); }
  }

  // ---------- Rendering ----------
  function renderNav() {
    var cur = currentRoute().id;
    var html = '<span class="brand">' + esc(t('app')) + '</span><span class="tag">' + esc(t('tagline')) + '</span>';
    ROUTES.forEach(function (r) {
      html += '<a href="#' + r.id + '" class="' + (r.id === cur ? 'active' : '') + '"' + (r.id === cur ? ' aria-current="page"' : '') + '>' +
              '<span class="ic" aria-hidden="true">' + r.icon + '</span><span>' + esc(t(r.id)) + '</span></a>';
    });
    document.getElementById('nav').innerHTML = html;
  }
  var renderToken = 0;
  function render() {
    document.documentElement.lang = lang;
    document.title = t('app') + ' - ' + t(currentRoute().id);
    renderNav();
    var token = ++renderToken, route = currentRoute().id, view = document.getElementById('view');
    revokeUrls();
    return Promise.resolve().then(function () { return currentRoute().view(); }).then(function (html) {
      if (token !== renderToken) return;
      view.innerHTML = html;
      window.scrollTo(0, 0);
      if (route === 'people') renderStage();
      if (route === 'search') runSearch();
      if (route === 'resume') { if (parseHash()[1] === 'snap') fitPaper(); else initResume(); }
      if (route === 'settings') { refreshStorageInfo(); refreshDbInfo(); refreshDeletedList(); refreshBackupUi(); }
    }).catch(function (err) {
      if (token === renderToken) view.innerHTML = '<div class="card"><p class="msg">' + esc(err && err.message || err) + '</p></div>';
    });
  }

  // ---------- Events ----------
  window.addEventListener('hashchange', render);
  window.addEventListener('resize', function () { fitPaper(); });
  document.addEventListener('keydown', function (e) { if (e.target.id === 'homeQ' && e.key === 'Enter' && e.target.value.trim()) location.hash = '#search/' + encodeURIComponent(e.target.value.trim()); });
  document.addEventListener('toggle', function (e) { if (e.target.tagName === 'DETAILS' && e.target.getAttribute('data-key')) rb.open[e.target.getAttribute('data-key')] = e.target.open; }, true);
  document.addEventListener('input', function (e) {
    if (e.target.id === 'srQ') { runSearch(); return; }
    if (e.target.classList && e.target.classList.contains('stageName')) { var si = recStage[parseInt(e.target.getAttribute('data-i'), 10)]; if (si) si.name = e.target.value; return; }
    if (rbHandle(e.target, 'input')) return;
    if (e.target.id !== 'docQ') return;
    var q = e.target.value.trim().toLowerCase();
    Array.prototype.forEach.call(document.querySelectorAll('[data-q]'), function (el) { el.hidden = !!q && el.getAttribute('data-q').indexOf(q) < 0; });
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (rbHandle(el, 'change')) return;
    if (el.id === 'srScope') { runSearch(); return; }
    if (el.id === 'tlTag') { tl.tag = el.value; render(); return; }
    if (el.id === 'stageInput') { var sf = Array.prototype.slice.call(el.files || []); el.value = ''; stageAdd(sf); return; }
    if (el.classList && el.classList.contains('recDocName')) {
      repo.update('documents', el.getAttribute('data-id'), { fileName: finalName(el.value, el.getAttribute('data-orig')) }).then(render);
      return;
    }
    if (el.id === 'switchPerson') updateWorkspace({ activePersonId: el.value }).then(render);
    if (el.id === 'r_current') { var ed = document.getElementById('r_endDate'); if (ed) ed.disabled = el.checked; }
    if (el.id === 'c_kind') { var ad = isAddr(el.value); document.getElementById('addrBox').hidden = !ad; document.getElementById('valBox').hidden = ad; }
    if (el.classList && el.classList.contains('photo-label')) repo.update('photos', el.getAttribute('data-id'), { label: el.value });
    if (el.id === 'rsInput') { if (el.files && el.files[0]) loadBackupFile(el.files[0]); el.value = ''; }
    if (el.id === 'bkScope') q('bkPeople').hidden = el.value !== 'selected';
    if (el.id === 'rsMode') {
      var hints = { merge: 'rsMergeHint', replace: 'rsReplaceHint', new: 'rsAsNewHint' };
      q('rsHint').textContent = t(hints[el.value]); q('rsPlan').textContent = planText(el.value); q('rsConfirmBox').hidden = el.value !== 'replace';
    }
    if (el.id === 'docInput') {
      var dfiles = Array.prototype.slice.call(el.files || []), dpid = el.getAttribute('data-person'), cat = document.getElementById('upCat').value;
      addDocuments(dpid, dfiles, cat).then(function (res) {
        el.value = '';
        if (res.errors.length) { var m = document.getElementById('docMsg'); if (m) m.textContent = res.errors.join(' · '); }
        if (res.added) { if (res.errors.length) { setTimeout(render, 2500); } else render(); }
      });
    }
    if (el.id === 'photoInput') {
      var files = Array.prototype.slice.call(el.files || []), pid = el.getAttribute('data-person');
      (async function () {
        for (var i = 0; i < files.length; i++) await addPhoto(pid, files[i]);
        render();
      })().catch(function (err) { var m = document.getElementById('photoMsg'); if (m) m.textContent = err.message; });
    }
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-lang]');
    if (b) {
      lang = b.getAttribute('data-lang');
      try { localStorage.setItem('pv_lang', lang); } catch (err) {}
      render(); return;
    }
    var act = e.target.closest && e.target.closest('[data-action]');
    if (act) {
      var a = act.getAttribute('data-action'), id = act.getAttribute('data-id');
      var fail = function (err) { var m = document.getElementById('formMsg'); if (m) m.textContent = err.message; };
      if (a === 'save-person') { savePerson(id).catch(fail); return; }
      if (a === 'rb-tab') { rb.tab = act.getAttribute('data-tab'); var rbx = document.querySelector('.rb'); if (rbx) rbx.setAttribute('data-tab', rb.tab); Array.prototype.forEach.call(document.querySelectorAll('[data-action="rb-tab"]'), function (b2) { b2.className = b2.getAttribute('data-tab') === rb.tab ? 'on' : ''; }); fitPaper(); return; }
      if (a === 'rb-move') {
        var ds = rb.draft.sections, ix = ds.findIndex(function (x) { return x.key === act.getAttribute('data-key'); }), j = ix + parseInt(act.getAttribute('data-dir'), 10);
        if (ix >= 0 && j >= 0 && j < ds.length) { var tmp = ds[ix]; ds[ix] = ds[j]; ds[j] = tmp; initResume(); }
        return;
      }
      if (a === 'rb-save') { rbSavePreset().catch(fail); return; }
      if (a === 'rb-del') { if (armed(act, t('tapDelete'))) repo.softDelete('resumeProfiles', rb.preset).then(function () { rb.preset = ''; render(); }); return; }
      if (a === 'rb-print') { rbPrint().catch(fail); return; }
      if (a === 'pkg-make') { pkgMake().catch(fail); return; }
      if (a === 'print-snap') { repo.get('generated', id).then(function (g) { if (g) printAs(g.name); }); return; }
      if (a === 'del-snap') { if (armed(act, t('tapDelete'))) repo.softDelete('generated', id).then(render); return; }
      if (a === 'tl-type') { var ty = act.getAttribute('data-type'); if (!ty) tl.types = {}; else tl.types[ty] = !tl.types[ty]; render(); return; }
      if (a === 'sr-tag') { q('srQ').value = '#' + act.getAttribute('data-tag'); runSearch(); return; }
      if (a === 'make-xlsx') { doExcel(act); return; }
      if (a === 'pick-stage') { q('stageInput').click(); return; }
      if (a === 'stage-rm') { recStage.splice(parseInt(act.getAttribute('data-i'), 10), 1); renderStage(); return; }
      if (a === 'make-backup') { doMakeBackup(act); return; }
      if (a === 'save-backup') { doSaveBackup(); return; }
      if (a === 'pick-restore') { q('rsInput').click(); return; }
      if (a === 'read-backup') { doReadBackup(); return; }
      if (a === 'do-restore') { doRestore(act); return; }
      if (a === 'snap-load') { snap.get().then(function (sn) { if (sn) { bkState.file = sn.blob; return readBackup(sn.blob, '').then(function (bk) { bkState.loaded = bk; return showRestorePreview(); }); } }).catch(function (e) { q('rsOut').innerHTML = warnP(errMsg(e)); }); return; }
      if (a === 'snap-save') { snap.get().then(function (sn) { if (sn) saveFile(sn.blob, sn.name); }); return; }
      if (a === 'restore-item') { repo.restore(act.getAttribute('data-store'), id).then(function () { refreshDeletedList(); refreshDbInfo(); }); return; }
      if (a === 'pick-doc') { document.getElementById('docInput').click(); return; }
      if (a === 'doc-cat') { docCat = act.getAttribute('data-cat'); render(); return; }
      if (a === 'save-doc') { saveDoc(id).catch(fail); return; }
      if (a === 'download-doc') { (async function () { var dd = await repo.get('documents', id), bb = await storage.local.get(dd.blobId); if (bb) await saveFile(bb, dd.fileName); })().catch(fail); return; }
      if (a === 'del-doc') { if (armed(act, t('tapDelete'))) repo.softDelete('documents', id).then(function () { location.hash = '#documents'; render(); }); return; }
      if (a === 'link') {
        var sv = document.getElementById(act.getAttribute('data-sel')).value;
        if (sv) linkDoc(act.getAttribute('data-person'), act.getAttribute('data-record') || sv, act.getAttribute('data-doc') || sv).then(render).catch(fail);
        return;
      }
      if (a === 'unlink') { repo.softDelete('recordDocs', id).then(render); return; }
      if (a === 'open-vault') { updateWorkspace({ activePersonId: id }).then(function () { location.hash = '#documents'; render(); }); return; }
      if (a === 'save-record') { saveRecord(act.getAttribute('data-person'), act.getAttribute('data-type'), id).catch(fail); return; }
      if (a === 'del-record') { if (armed(act, t('tapDelete'))) repo.softDelete('records', id).then(render); return; }
      if (a === 'save-contact') { saveContact(act.getAttribute('data-person'), id).catch(fail); return; }
      if (a === 'del-contact') { if (armed(act, t('tapDelete'))) repo.softDelete('contacts', id).then(render); return; }
      if (a === 'pick-photo') { document.getElementById('photoInput').click(); return; }
      if (a === 'photo-active') { setActivePhoto(act.getAttribute('data-person'), id).then(render); return; }
      if (a === 'photo-del') { if (armed(act, t('tapDelete'))) deletePhoto(id).then(render); return; }
      if (a === 'make-active') { updateWorkspace({ activePersonId: id }).then(render); return; }
      if (a === 'ask-delete') { document.getElementById('delBox').hidden = false; return; }
      if (a === 'cancel-delete') { document.getElementById('delBox').hidden = true; return; }
      if (a === 'do-delete') { repo.softDeletePerson(id).then(function () { location.hash = '#people'; render(); }); return; }
      if (a === 'restore-person') { repo.restorePerson(id).then(function () { refreshDeletedList(); refreshDbInfo(); }); return; }
      if (a === 'purge-person') {
        if (!act.getAttribute('data-armed')) { act.setAttribute('data-armed', '1'); act.textContent = t('tapAgain'); act.className = 'btn danger sm'; return; }
        repo.purgePerson(id).then(function () { refreshDeletedList(); refreshDbInfo(); });
        return;
      }
    }
    if (e.target.id === 'deviceSave') {
      var nm = document.getElementById('deviceName').value.trim().slice(0, 60);
      updateWorkspace({ deviceName: nm || guessDeviceName() }).then(function () {
        e.target.textContent = t('saved'); setTimeout(function () { e.target.textContent = t('save'); }, 1500);
      });
      return;
    }
    if (e.target.id === 'testBtn') {
      var btn = e.target, out = document.getElementById('testOut');
      btn.disabled = true; out.innerHTML = '<p class="sub">' + esc(t('testRunning')) + '</p>';
      runSelfTest().then(function (res) {
        var failed = res.filter(function (x) { return !x.pass; }).length;
        out.innerHTML = '<p><span class="pill ' + (failed ? 'warn' : 'ok') + '">' + esc(failed ? t('testSomeFail') : t('testAllPass')) + '</span></p>' +
          '<ul class="tests">' + res.map(function (x) { return '<li class="' + (x.pass ? '' : 'fail') + '">' + (x.pass ? '✓ ' : '✗ ') + esc(x.name) + '</li>'; }).join('') + '</ul>';
      }).catch(function (err) { out.innerHTML = '<p class="sub">' + esc(err.message) + '</p>'; })
        .then(function () { btn.disabled = false; refreshDbInfo(); });
      return;
    }
    if (e.target.id === 'persistBtn') {
      var msg = document.getElementById('persistMsg');
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().then(function (ok) { msg.textContent = ok ? '' : t('persistDenied'); refreshStorageInfo(); });
      } else { msg.textContent = t('persistDenied'); }
    }
  });

  render();
})();
</script>
</body>
</html>
